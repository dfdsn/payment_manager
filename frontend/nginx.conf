server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # H09.1 (PWA): files that decide which version of the app shell runs are always revalidated, so a new
  # release reaches installed apps. The service worker never caches /api (ngsw-config.json).
  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /ngsw.json {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /safety-worker.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Hashed bundles never change content under the same name; a missing file is a 404, never index.html.
  location ~* ^/(chunk|main|polyfills|styles)-[A-Z0-9]+\.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(js|css|png|ico|svg|webmanifest)$ {
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
