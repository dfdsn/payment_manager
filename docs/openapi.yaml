openapi: 3.1.0
info:
  title: account_Manager API
  version: 0.1.0
  description: Contrato versionado dos endpoints implementados até H04.1.
servers:
  - url: /api/v1
paths:
  /expenses/{expenseId}/attachments:
    get:
      summary: Lista anexos disponíveis da despesa
      responses: { '200': { description: Lista autorizada } }
    post:
      summary: Anexa PDF, JPG ou PNG (máximo 10 MB e cinco por despesa)
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses: { '201': { description: Anexo promovido e disponível }, '409': { description: Limite ou chave conflitante } }
  /expenses/{expenseId}/attachments/{attachmentId}:
    get:
      summary: Baixa conteúdo privado após autorização
      responses: { '200': { description: Conteúdo }, '404': { description: Ausente ou inacessível } }
    delete:
      summary: Remove conteúdo preservando metadado e auditoria
      responses: { '204': { description: Removido } }
  /auth/csrf:
    get:
      operationId: issueCsrfToken
      summary: Emite o cookie CSRF para uma operação mutável subsequente
      responses:
        "200":
          description: Cookie XSRF-TOKEN emitido e nome do header retornado.
          content:
            application/json:
              schema:
                type: object
                required: [headerName]
                properties:
                  headerName:
                    const: X-XSRF-TOKEN
  /auth/login:
    post:
      operationId: login
      summary: Autentica uma conta confirmada e cria uma sessão JDBC
      security:
        - xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Sessão criada; o cookie SESSION é HttpOnly e SameSite=Lax.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      summary: Encerra a sessão atual
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      responses:
        "204":
          description: Sessão atual invalidada.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/sessions:
    delete:
      operationId: revokeAllSessions
      summary: Revoga todas as sessões JDBC da conta autenticada
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      responses:
        "204":
          description: Todas as sessões da conta foram revogadas.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/email-confirmations:
    post:
      operationId: requestEmailConfirmation
      summary: Solicita confirmação de email sem revelar se a conta existe
      security:
        - xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAccessRequest"
      responses:
        "202":
          $ref: "#/components/responses/GenericEmailAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/email-confirmations/confirm:
    post:
      operationId: confirmEmail
      summary: Confirma o email com token de uso único válido por 24 horas
      security:
        - xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenRequest"
      responses:
        "204":
          description: Email confirmado e token consumido.
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/password-resets:
    post:
      operationId: requestPasswordReset
      summary: Solicita recuperação sem revelar se a conta existe
      security:
        - xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAccessRequest"
      responses:
        "202":
          $ref: "#/components/responses/GenericEmailAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/password-resets/complete:
    post:
      operationId: completePasswordReset
      summary: Redefine a senha com token de uso único válido por 30 minutos
      description: O sucesso consome o token e revoga todas as sessões JDBC da conta.
      security:
        - xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Senha redefinida, token consumido e sessões revogadas.
        "400":
          $ref: "#/components/responses/BadRequest"
  /setup/status:
    get:
      operationId: getInitialSetupStatus
      summary: Consulta se a configuração inicial está disponível
      responses:
        "200":
          description: Estado consultado; também emite o cookie XSRF-TOKEN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /setup:
    post:
      operationId: configureInitialAdministratorAndSpace
      summary: Cria o primeiro administrador e seu espaço uma única vez
      description: >-
        Requer que X-XSRF-TOKEN corresponda ao cookie XSRF-TOKEN e que
        X-Setup-Secret contenha o segredo temporário configurado no servidor.
      security:
        - xsrfCookie: []
          xsrfHeader: []
          setupSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitialSetupRequest"
      responses:
        "201":
          description: Administrador, espaço e associação criados atomicamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialSetupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: >-
            CSRF ausente/inválido (o filtro pode responder sem corpo) ou segredo
            temporário incorreto (ApiError com code SETUP_SECRET_INVALID).
        "409":
          description: A configuração inicial já foi concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: O segredo temporário não está configurado no servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /identity/me:
    get:
      operationId: getAuthenticatedUserContext
      summary: Retorna identidade, papel e espaço do principal autenticado
      security:
        - sessionCookie: []
      parameters:
        - name: X-User-Activity
          in: header
          required: false
          schema:
            type: boolean
          description: >-
            Em GET, true registra atividade humana e renova somente a janela de
            inatividade. A duração absoluta de 30 dias nunca é renovada.
      responses:
        "200":
          description: Associação ativa do usuário autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Sessão válida, porém sem associação ativa (ApiError com code
            ACTIVE_SPACE_ACCESS_NOT_FOUND).
  /identity/invitations:
    get:
      operationId: getPendingInvitation
      summary: Consulta o convite pendente do espaço administrado
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Estado do convite; somente administrador do espaço.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: inviteSecondMember
      summary: Cria convite de uso único válido por sete dias
      description: O envio SMTP ocorre após o commit; falha preserva o convite para reenvio explícito.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRequest"
      responses:
        "201":
          description: Convite persistido e envio solicitado.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Convite já pendente, destinatário indisponível ou espaço completo.
        "503":
          description: Convite persistido, mas a entrega SMTP falhou; pode ser reenviado.
    delete:
      operationId: revokeInvitation
      summary: Revoga o convite pendente
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      responses:
        "204":
          description: Convite revogado ou nenhum convite estava pendente.
        "403":
          $ref: "#/components/responses/Forbidden"
  /identity/invitations/resend:
    post:
      operationId: resendInvitation
      summary: Substitui explicitamente o convite pendente e invalida o token anterior
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      responses:
        "202":
          description: Novo token persistido e envio solicitado.
        "404":
          description: Não há convite válido pendente.
        "503":
          description: Novo convite persistido, mas a entrega SMTP falhou.
  /invitations/preview:
    get:
      operationId: previewInvitation
      summary: Valida o token e informa como a identidade destinatária deve aceitar
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Convite utilizável; o token nunca é ecoado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
  /invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Aceita o convite como segundo membro convidado
      description: >-
        Conta nova é criada com email confirmado pelo link. Conta já confirmada
        precisa estar autenticada como o destinatário. A operação é serializada
        por espaço, consome o token uma vez e respeita o limite de dois membros.
      security:
        - xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptanceRequest"
      responses:
        "204":
          description: Convite consumido e associação GUEST criada.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Conta existente confirmada precisa entrar antes de aceitar.
        "403":
          description: Sessão pertence a identidade diferente da destinatária.
        "409":
          description: Destinatário já associado ou espaço sem vaga.
  /identity/members:
    get:
      operationId: listActiveSpaceMembers
      summary: Lista os membros ativos e seus papéis no espaço da sessão
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Associações ativas do mesmo espaço.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /identity/members/{userId}:
    delete:
      operationId: removeGuestMember
      summary: Encerra a associação do convidado e revoga todas as suas sessões
      description: Preserva usuário e associação inativa para referências históricas e libera uma vaga.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - $ref: "#/components/parameters/MemberUserId"
      responses:
        "204":
          description: Convidado removido e sessões revogadas.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Membro ativo não encontrado neste espaço.
        "409":
          description: Associação ou papel mudou durante a operação.
  /identity/members/{userId}/administration-transfer:
    post:
      operationId: transferSpaceAdministration
      summary: Transfere atomicamente a administração ao convidado ativo
      description: O antigo administrador passa a convidado. Consentimento e número de WhatsApp não são transferidos.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - $ref: "#/components/parameters/MemberUserId"
      responses:
        "204":
          description: Papéis trocados e evento durável registrado.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Convidado ativo não encontrado neste espaço.
        "409":
          description: Papéis mudaram concorrentemente ou destino inválido.
  /identity/membership/leave:
    post:
      operationId: leaveCurrentSpace
      summary: Permite ao convidado sair voluntariamente e revoga suas sessões
      description: Administrador deve transferir a administração antes; encerramento de espaço não faz parte deste contrato.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      responses:
        "204":
          description: Associação encerrada, histórico preservado e sessões revogadas.
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Usuário ainda é administrador ou associação mudou concorrentemente.
  /categories:
    get:
      operationId: listCategories
      summary: Lista categorias do espaço ativo
      security: [{ sessionCookie: [] }]
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Categorias do espaço, ordenadas por nome.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Category" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createCategory
      summary: Cria uma categoria no espaço ativo
      security: [{ sessionCookie: [], xsrfCookie: [], xsrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryNameRequest" }
      responses:
        "201":
          description: Categoria criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Nome já utilizado no espaço. }
  /categories/{id}:
    put:
      operationId: renameCategory
      summary: Renomeia uma categoria com controle otimista
      security: [{ sessionCookie: [], xsrfCookie: [], xsrfHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameCategoryRequest" }
      responses:
        "200":
          description: Categoria renomeada; despesas vinculadas passam a exibir o novo nome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Categoria não encontrada no espaço ativo. }
        "409": { description: Versão desatualizada, categoria arquivada ou nome duplicado. }
  /categories/{id}/archive:
    post:
      operationId: archiveCategory
      summary: Impede novas associações sem apagar referências existentes
      security: [{ sessionCookie: [], xsrfCookie: [], xsrfHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryVersionRequest" }
      responses:
        "200":
          description: Categoria arquivada; histórico e despesas existentes preservados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Categoria não encontrada no espaço ativo. }
        "409": { description: Versão desatualizada ou categoria já arquivada. }
  /expenses:
    post:
      operationId: createOneOffExpense
      summary: Cadastra uma despesa avulsa pendente ou já paga
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID preservado ao repetir a mesma intenção após falha de resposta.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
      responses:
        "201":
          description: Despesa criada; Location identifica o recurso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "200":
          description: Repetição da mesma chave e payload; retorna a despesa original sem duplicar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A chave já foi utilizada com outro payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listExpenses
      summary: Lista somente as despesas do espaço ativo do usuário
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [REFERENCE_DATE, AMOUNT, DESCRIPTION]
            default: REFERENCE_DATE
        - name: direction
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
        - { name: search, in: query, description: Busca case-insensitive somente na descrição., schema: { type: string, maxLength: 200 } }
        - { name: dateFrom, in: query, description: Limite inicial inclusivo; sem período informado usa o primeiro dia do mês atual do espaço., schema: { type: string, format: date } }
        - { name: dateTo, in: query, description: Limite final inclusivo; sem período informado usa o último dia do mês atual do espaço., schema: { type: string, format: date } }
        - name: dateBasis
          in: query
          description: DUE_DATE usa a data de referência/vencimento; PAYMENT_DATE usa a data efetiva do pagamento.
          schema: { type: string, enum: [DUE_DATE, PAYMENT_DATE], default: DUE_DATE }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutCategory, in: query, schema: { type: boolean, default: false } }
        - { name: responsibleUserId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutResponsible, in: query, schema: { type: boolean, default: false } }
        - { name: payerUserId, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          description: ACTIVE oculta canceladas; OVERDUE é subconjunto de PENDING e considera o dia atual no fuso do espaço.
          schema: { type: string, enum: [ACTIVE, PENDING, OVERDUE, PAID, CANCELLED, ALL], default: ACTIVE }
      responses:
        "200":
          description: Página com ordenação estável e atraso calculado no fuso do espaço.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /expenses/filter-options:
    get:
      operationId: getExpenseFilterOptions
      summary: Lista responsáveis e pagadores presentes nas despesas do espaço ativo
      description: Inclui membros anteriores ainda referenciados, identificados por activeMember=false.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Opções autorizadas, sem dados de outros espaços.
          content:
            application/json:
              schema:
                type: object
                required: [responsiblePeople, payerPeople]
                properties:
                  responsiblePeople: { type: array, items: { $ref: "#/components/schemas/ExpenseFilterPerson" } }
                  payerPeople: { type: array, items: { $ref: "#/components/schemas/ExpenseFilterPerson" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /expenses/{id}:
    get:
      operationId: getExpense
      summary: Consulta uma despesa do espaço ativo para edição
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Despesa atual, incluindo sua versão otimista.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Despesa não encontrada no espaço ativo.
    put:
      operationId: correctExpense
      summary: Corrige os campos editáveis sem alterar a situação da despesa
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID preservado ao repetir a mesma correção após falha de resposta.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectExpenseRequest" }
      responses:
        "200":
          description: Correção aplicada ou repetição idempotente do mesmo resultado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Despesa não encontrada no espaço ativo.
        "409":
          description: Versão ou situação desatualizada, ou chave reutilizada com outro payload. Consulte novamente antes de reaplicar; não há sobrescrita forçada.
  /expenses/{id}/payment:
    post:
      operationId: settleExpense
      summary: Quita integralmente uma despesa pendente
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "200":
          description: Quitação criada ou repetição idempotente do mesmo resultado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Despesa não encontrada no espaço ativo.
        "409":
          description: >-
            Despesa já paga, versão desatualizada, chave reutilizada com outro payload ou
            `CHARGE_CONFIRMATION_REQUIRED` quando a cobrança recorrente ainda é estimada e
            `confirmedChargeAmount` não foi informado.
  /expenses/{id}/charge-confirmation:
    post:
      operationId: confirmExpenseCharge
      summary: Confirma o valor real de uma cobrança recorrente estimada (H04.4)
      description: >-
        Substitui a estimativa pelo valor confirmado, preserva a estimativa anterior e registra autor e instante.
        Não quita a despesa. Somente despesas PENDING de origem RECURRENCE com `chargeConfirmed=false`
        são elegíveis. As ocorrências posteriores ainda não confirmadas da mesma recorrência variável passam
        a usar este valor como estimativa; anteriores, pagas, canceladas ou já confirmadas não mudam.
        Ocorrência, despesa, auditoria e propagação são gravadas na mesma transação.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargeConfirmationRequest" }
      responses:
        "200":
          description: Valor confirmado ou repetição idempotente do mesmo resultado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Despesa não encontrada no espaço ativo.
        "409":
          description: >-
            `CHARGE_ALREADY_CONFIRMED` (use a correção individual), `EXPENSE_STATE_CONFLICT`
            (versão desatualizada, despesa paga ou cancelada) ou `IDEMPOTENCY_CONFLICT`.
  /expenses/{id}/history:
    get:
      operationId: listExpenseHistory
      summary: Consulta o histórico paginado de uma despesa do espaço ativo
      description: Eventos persistidos são ordenados de forma determinística por instante, versão e tipo. Horários são instantes UTC; a interface os apresenta no fuso do espaço.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: Página de criação, correções, quitações, reversões e cancelamento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseHistoryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Despesa não encontrada no espaço ativo. }
  /expenses/batch-payment:
    post:
      operationId: settleExpensesBatch
      summary: Quita integralmente vários lançamentos em uma única transação
      description: >-
        Data e pagador são comuns ao lote; cada item usa o valor confirmado da própria cobrança.
        Todos os itens são validados e bloqueados antes da gravação. Qualquer item indisponível,
        inelegível ou desatualizado rejeita o lote inteiro, sem efeitos parciais.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID da intenção completa; deve ser preservado somente ao repetir o mesmo conteúdo.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchPaymentRequest" }
      responses:
        "200":
          description: Lote aplicado integralmente ou replay idempotente do resultado original.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchPaymentResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >-
            Lote integralmente rejeitado por item indisponível, não pendente, com valor não confirmado
            ou versão desatualizada; também cobre chave idempotente reutilizada com conteúdo diferente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /expenses/{id}/payment-reversal:
    post:
      operationId: reverseExpensePayment
      summary: Desfaz a quitação ativa preservando pagamento e reversão no histórico
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseActionRequest" }
      responses:
        "200":
          description: Quitação desfeita ou repetição idempotente; a despesa volta a PENDING.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400":
          description: Motivo inválido ou despesa paga sem vencimento; nesse caso, informe o vencimento pelo fluxo de correção antes da reversão.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Despesa não encontrada no espaço ativo. }
        "409": { description: Situação ou versão desatualizada, ou chave reutilizada com outro payload. }
  /expenses/{id}/cancellation:
    post:
      operationId: cancelExpense
      summary: Cancela uma despesa pendente sem exclusão física
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseActionRequest" }
      responses:
        "200":
          description: Despesa cancelada ou repetição idempotente; permanece consultável por id e some da lista ativa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Despesa não encontrada no espaço ativo. }
        "409": { description: Despesa paga/cancelada, versão desatualizada ou chave reutilizada com outro payload. }
  /recurrences:
    get:
      summary: Lista as definições de recorrência do espaço autenticado
      responses:
        '200':
          description: Definições autorizadas; não representa despesas materializadas
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Recurrence' } } } }
    post:
      summary: Cadastra uma definição de recorrência sem gerar lançamentos
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRecurrence' } } }
      responses:
        '201': { description: Definição criada }
        '200': { description: Repetição idempotente da definição criada }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Chave reutilizada com conteúdo diferente }
  /recurrences/calendar-preview:
    post:
      summary: Calcula até 12 vencimentos sem persistir ou gerar despesas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstDueDate, frequency]
              properties:
                firstDueDate: { type: string, format: date }
                lastDueDate: { type: [string, 'null'], format: date }
                frequency: { $ref: '#/components/schemas/RecurrenceFrequency' }
      responses:
        '200':
          description: Datas calculadas a partir do dia-base original
          content: { application/json: { schema: { type: array, maxItems: 12, items: { type: string, format: date } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /recurrences/forecasts:
    get:
      summary: Consulta ocorrências do mês atual e dos 12 meses seguintes
      responses:
        '200':
          description: Previsões reconciliadas com lançamentos já materializados, sem persistir durante a consulta
          content: { application/json: { schema: { $ref: '#/components/schemas/ForecastPeriod' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /recurrences/{recurrenceId}/occurrences/{scheduledDueDate}/anticipation:
    post:
      summary: Materializa antecipadamente uma ocorrência prevista
      parameters:
        - { in: path, name: recurrenceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: scheduledDueDate, required: true, schema: { type: string, format: date } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties: { confirmed: { type: boolean, const: true } }
      responses:
        '200':
          description: Ocorrência materializada ou repetição idempotente
          content: { application/json: { schema: { $ref: '#/components/schemas/AnticipationResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Calendário mudou, ocorrência fora do horizonte ou chave reutilizada com outro conteúdo. }
  /recurrences/{recurrenceId}/occurrences/{scheduledDueDate}/charge-confirmation:
    post:
      summary: Confirma o valor de uma ocorrência variável a partir da previsão (H04.4)
      description: >-
        Reutiliza a materialização da H04.3 pela identidade `(recurrenceId, scheduledDueDate)` e confirma a
        despesa resultante na mesma transação, sem duplicá-la. Se a ocorrência já estiver materializada, ainda
        estimada e na versão original 0, confirma essa mesma despesa; se já tiver sido alterada, responde 409 e a
        confirmação deve ser feita pela despesa com sua versão atual. Recorrências de valor fixo são recusadas.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - { in: path, name: recurrenceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: scheduledDueDate, required: true, schema: { type: string, format: date } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmedAmount]
              properties:
                confirmedAmount: { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$' }
      responses:
        '200':
          description: Ocorrência materializada e confirmada, ou repetição idempotente
          content: { application/json: { schema: { $ref: '#/components/schemas/AnticipationResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            `CHARGE_ALREADY_CONFIRMED`, `EXPENSE_STATE_CONFLICT` (a ocorrência mudou), `IDEMPOTENCY_CONFLICT`
            ou ocorrência fora do calendário/horizonte.
  /recurrences/{recurrenceId}/changes/preview:
    post:
      summary: Calcula o impacto de alterar a recorrência a partir de um período (H04.5)
      description: >-
        Somente leitura. O corpo traz a configuração completa desejada a partir do período de `effectiveDueDate`, que
        precisa ser um vencimento da programação atual entre o mês atual e os 12 meses seguintes. Campos iguais à
        configuração vigente naquele período não contam como alterados. `impactToken` identifica exatamente este impacto.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - { in: path, name: recurrenceId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangeRecurrenceRequest' } } }
      responses:
        '200':
          description: Impacto calculado; nada foi gravado
          content: { application/json: { schema: { $ref: '#/components/schemas/RecurrenceImpact' } } }
        '400': { description: 'Campo inválido, nenhum campo alterado, período fora do horizonte ou `CATEGORY_NOT_SELECTABLE`.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: '`RECURRENCE_NOT_FOUND`, inclusive para recorrência de outro espaço.' }
        '409': { description: '`RECURRENCE_VERSION_CONFLICT`: a versão informada não é a atual.' }
  /recurrences/{recurrenceId}/changes:
    post:
      summary: Aplica "este e os próximos" (H04.5)
      description: >-
        Recalcula o impacto no momento de salvar, sob lock da definição e dos lançamentos, e só aplica se o resultado
        for idêntico ao revisado (`impactToken`). Atualiza a definição a partir do período, os lançamentos pendentes
        afetados e registra auditoria, tudo numa transação. Pagos e cancelados nunca são reescritos; valores
        confirmados e vencimentos corrigidos individualmente são preservados.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - { in: path, name: recurrenceId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangeRecurrenceRequest' } } }
      responses:
        '200':
          description: Alteração aplicada ou repetição idempotente (`replayed=true`)
          content: { application/json: { schema: { $ref: '#/components/schemas/RecurrenceChangeResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: '`RECURRENCE_NOT_FOUND`.' }
        '409':
          description: >-
            `RECURRENCE_VERSION_CONFLICT`, `RECURRENCE_IMPACT_CHANGED` (os dados mudaram desde a prévia; nada foi
            aplicado) ou `IDEMPOTENCY_CONFLICT`.
  /recurrences/{recurrenceId}/closure/preview:
    post:
      summary: Calcula o impacto de encerrar a recorrência (H04.5)
      description: >-
        Somente leitura. O último período é o último vencimento da programação em ou antes de `lastDueDate`
        (inclusivo). O término só pode ser antecipado; reativar, pausar ou excluir não existem.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - { in: path, name: recurrenceId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CloseRecurrenceRequest' } } }
      responses:
        '200':
          description: Impacto calculado; nada foi gravado
          content: { application/json: { schema: { $ref: '#/components/schemas/RecurrenceImpact' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: '`RECURRENCE_NOT_FOUND`.' }
        '409': { description: '`RECURRENCE_VERSION_CONFLICT`.' }
  /recurrences/{recurrenceId}/closure:
    post:
      summary: Encerra a recorrência (H04.5)
      description: >-
        Interrompe novas ocorrências depois do último período. Não apaga histórico nem cancela todas as despesas:
        somente lançamentos pendentes e ainda estimados depois do término são cancelados com o motivo informado;
        pagos, confirmados ou com vencimento corrigido ficam marcados para revisão individual. `reason` é obrigatório.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - { in: path, name: recurrenceId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CloseRecurrenceRequest' } } }
      responses:
        '200':
          description: Recorrência encerrada ou repetição idempotente
          content: { application/json: { schema: { $ref: '#/components/schemas/RecurrenceChangeResult' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: '`RECURRENCE_NOT_FOUND`.' }
        '409': { description: '`RECURRENCE_VERSION_CONFLICT`, `RECURRENCE_IMPACT_CHANGED` ou `IDEMPOTENCY_CONFLICT`.' }
  /installment-purchases/preview:
    post:
      summary: Calcula as parcelas de uma compra sem gravar (H05.1)
      description: >-
        Valida descrição, total, quantidade, primeiro vencimento, categoria e responsável e devolve o cálculo do
        servidor: valores em centavos inteiros com a diferença na última parcela e vencimentos mensais pela regra do
        dia de referência. Nada é gravado; a criação recalcula e revalida tudo.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentPurchaseRequest' } } }
      responses:
        '200':
          description: Prévia calculada
          content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentPreview' } } }
        '400':
          description: >-
            `INSTALLMENT_VALIDATION` (com `field`: description, totalAmount, installmentCount, firstDueDate,
            responsibleUserId) ou `CATEGORY_NOT_SELECTABLE`.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`ACTIVE_SPACE_ACCESS_NOT_FOUND`.' }
  /installment-purchases:
    post:
      summary: Cria a compra parcelada e todas as parcelas (H05.1)
      description: >-
        Grava numa transação o cabeçalho da compra (que não é despesa), as N parcelas como despesas pendentes com
        origem `INSTALLMENT` e identificação n/N, e o evento `PURCHASE_CREATED`. A chave vale por espaço e autor:
        a mesma chave com o mesmo conteúdo devolve a compra original sem duplicar parcelas nem auditoria, inclusive
        sob concorrência.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentPurchaseRequest' } } }
      responses:
        '201':
          description: Compra e parcelas criadas
          headers:
            Location: { schema: { type: string }, description: '/api/v1/installment-purchases/{id}' }
          content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentPurchase' } } }
        '200':
          description: Repetição idempotente; devolve a compra original.
          content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentPurchase' } } }
        '400':
          description: >-
            `INSTALLMENT_VALIDATION` (inclusive `field: Idempotency-Key` quando ausente) ou `CATEGORY_NOT_SELECTABLE`.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`ACTIVE_SPACE_ACCESS_NOT_FOUND`.' }
        '409': { description: '`IDEMPOTENCY_CONFLICT`: a chave já foi usada com outros dados.' }
    get:
      summary: Lista as compras parceladas do espaço com o progresso (H05.2)
      description: >-
        Compras do espaço ativo, das mais recentes para as mais antigas. O progresso é derivado apenas da situação
        das parcelas (pagas, pendentes, atrasadas no fuso do espaço e canceladas); não representa saldo bancário.
        As parcelas são quitadas pelo lote atômico de despesas (`POST /expenses/batch-payment`).
      security:
        - sessionCookie: []
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Página de compras
          content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentPurchasePage' } } }
        '400':
          description: '`INSTALLMENT_VALIDATION` com `field` `page` ou `size`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`ACTIVE_SPACE_ACCESS_NOT_FOUND`.' }
  /installment-purchases/{id}:
    get:
      summary: Detalha uma compra com a situação de cada parcela (H05.2)
      description: >-
        Cabeçalho da compra (valores informados na criação), progresso e as parcelas com situação, versão,
        atraso, data e valor pagos e a descrição, categoria e responsável atuais de cada uma.
      security:
        - sessionCookie: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Compra e parcelas
          content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentPurchase' } } }
        '400': { description: '`INSTALLMENT_VALIDATION` (identificador inválido).' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`ACTIVE_SPACE_ACCESS_NOT_FOUND`.' }
        '404': { description: '`INSTALLMENT_PURCHASE_NOT_FOUND`: inexistente ou de outro espaço.' }
  /installment-purchases/{id}/changes/preview:
    post:
      summary: Mostra o impacto de alterar parcelas pendentes, sem gravar (H05.3)
      description: >-
        A partir de uma parcela pendente, com alcance `THIS` (só ela) ou `THIS_AND_FOLLOWING` (ela e as pendentes
        seguintes), calcula as parcelas afetadas com "de → para" e as preservadas com o motivo (`PAID`, `CANCELLED`,
        `BEFORE_START`, `OUTSIDE_SCOPE`, `UNCHANGED`). Um novo vencimento vale para a parcela escolhida e recalcula
        as seguintes mês a mês pela diferença de número (meses curtos no último dia). Valor e quantidade não mudam.
        Devolve `impactToken`, que a confirmação precisa reenviar.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentChangeRequest' } } }
      responses:
        '200':
          description: Impacto calculado; nada foi gravado.
          content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentImpact' } } }
        '400':
          description: >-
            `INSTALLMENT_VALIDATION` (`fromNumber`, `scope`, `changedFields` inclusive quando nada muda,
            `description`, `dueDate`), `CATEGORY_NOT_SELECTABLE` ou responsável inválido.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`ACTIVE_SPACE_ACCESS_NOT_FOUND`.' }
        '404': { description: '`INSTALLMENT_PURCHASE_NOT_FOUND`.' }
        '409': { description: '`INSTALLMENT_NOT_PENDING`: a parcela escolhida está paga ou cancelada.' }
  /installment-purchases/{id}/changes:
    post:
      summary: Aplica a alteração revisada das parcelas pendentes (H05.3)
      description: >-
        Trava a compra e as parcelas, recalcula o impacto e só grava se ele for igual ao revisado (`impactToken`).
        Atualiza apenas os campos listados em `changedFields` das parcelas afetadas, registra o evento
        `INSTALLMENT_CHANGE_APPLIED` no histórico de cada uma e a alteração em `installment_purchase_changes`,
        tudo numa transação. A mesma `Idempotency-Key` com o mesmo corpo devolve o resultado original
        (`replayed: true`).
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentChangeRequest' } } }
      responses:
        '200':
          description: Alteração aplicada (ou repetição idempotente).
          content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentChangeResult' } } }
        '400': { description: 'Como na prévia, e `INSTALLMENT_VALIDATION` com `field: Idempotency-Key` quando ausente.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`ACTIVE_SPACE_ACCESS_NOT_FOUND`.' }
        '404': { description: '`INSTALLMENT_PURCHASE_NOT_FOUND`.' }
        '409':
          description: >-
            `INSTALLMENT_IMPACT_CHANGED` (`field: impactToken`; revisar de novo), `INSTALLMENT_NOT_PENDING` ou
            `IDEMPOTENCY_CONFLICT`. Nada é gravado.
  /installment-purchases/{id}/cancellation/preview:
    post:
      summary: Mostra o impacto de cancelar parcelas pendentes selecionadas, sem gravar (H05.3)
      description: >-
        Lista as parcelas que serão canceladas (todas precisam estar pendentes), as preservadas (`PAID`,
        `CANCELLED`, `NOT_SELECTED`), a soma cancelada e, se informada, a prévia da nova compra com o restante.
        Nada é estornado nem desfeito.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentCancellationRequest' } } }
      responses:
        '200':
          description: Impacto calculado; nada foi gravado.
          content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentImpact' } } }
        '400':
          description: >-
            `INSTALLMENT_VALIDATION` (`installmentNumbers`, `reason` ou campos da nova compra),
            `CATEGORY_NOT_SELECTABLE` ou responsável inválido.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`ACTIVE_SPACE_ACCESS_NOT_FOUND`.' }
        '404': { description: '`INSTALLMENT_PURCHASE_NOT_FOUND`.' }
        '409': { description: '`INSTALLMENT_NOT_PENDING`: alguma parcela selecionada está paga ou cancelada.' }
  /installment-purchases/{id}/cancellation:
    post:
      summary: Cancela as parcelas revisadas e cria a nova compra opcional, numa transação (H05.3)
      description: >-
        Trava a compra e as parcelas, confere o `impactToken`, cria a nova compra com o restante (se informada,
        com `replacesPurchaseId`), cancela as parcelas selecionadas com o motivo e o evento `INSTALLMENT_CANCELLED`
        e registra a alteração. Falha em qualquer passo desfaz tudo. Idempotente por `Idempotency-Key`.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentCancellationRequest' } } }
      responses:
        '200':
          description: Cancelamento aplicado (ou repetição idempotente).
          content: { application/json: { schema: { $ref: '#/components/schemas/InstallmentChangeResult' } } }
        '400': { description: 'Como na prévia, e `INSTALLMENT_VALIDATION` com `field: Idempotency-Key` quando ausente.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: '`ACTIVE_SPACE_ACCESS_NOT_FOUND`.' }
        '404': { description: '`INSTALLMENT_PURCHASE_NOT_FOUND`.' }
        '409': { description: '`INSTALLMENT_IMPACT_CHANGED`, `INSTALLMENT_NOT_PENDING` ou `IDEMPOTENCY_CONFLICT`. Nada é gravado.' }
  /reports/due-dashboard:
    get:
      operationId: dueDashboard
      summary: Indicadores do mês por vencimento, agregados no banco sobre todo o conjunto autorizado
      description: >-
        Base temporal DUE_DATE (data de referência: vencimento, ou data do pagamento quando a despesa paga não tem
        vencimento). Os mesmos filtros de GET /expenses valem para todos os indicadores e para as pendências anteriores.
        Canceladas nunca entram nos totais. Previsões de recorrência ainda não geradas e o cabeçalho de compras
        parceladas não entram (as parcelas geradas entram uma vez cada). Leitura em transação somente leitura
        REPEATABLE READ.
      security:
        - sessionCookie: []
      parameters:
        - { name: month, in: query, description: Mês AAAA-MM; ausente usa o mês atual no fuso do espaço., schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutCategory, in: query, schema: { type: boolean, default: false } }
        - { name: responsibleUserId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutResponsible, in: query, schema: { type: boolean, default: false } }
        - { name: payerUserId, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          description: >-
            Mesmos valores de GET /expenses. As pendências anteriores usam PENDING para ACTIVE/PENDING/ALL, OVERDUE para
            OVERDUE e ficam vazias para PAID/CANCELLED.
          schema: { type: string, enum: [ACTIVE, PENDING, OVERDUE, PAID, CANCELLED, ALL], default: ACTIVE }
      responses:
        "200":
          description: Indicadores com dinheiro em strings decimais exatas de duas casas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DueDashboard" }
        "400":
          description: Mês ou combinação de filtros inválida (REPORT_QUERY_INVALID).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Sem associação ativa a um espaço (ACTIVE_SPACE_ACCESS_NOT_FOUND)., content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /reports/payments:
    get:
      operationId: paymentsReport
      summary: Quitações ativas do mês pela data efetiva do pagamento, com totais sobre toda a seleção e uma página
      description: >-
        Base temporal PAYMENT_DATE: somente despesas com quitação ativa cuja data de pagamento cai no mês. Quitações
        desfeitas não aparecem; a nova quitação aparece uma vez. Correções de valor, data e pagador já estão refletidas
        e a linha identifica a última (autor, instante, campos). Mesmos filtros de GET /expenses, sem filtro de
        situação. Os indicadores somam toda a seleção, não a página. Não há pendente, saldo nem resultado financeiro.
      security:
        - sessionCookie: []
      parameters:
        - { name: month, in: query, description: Mês AAAA-MM; ausente usa o mês atual no fuso do espaço., schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutCategory, in: query, schema: { type: boolean, default: false } }
        - { name: responsibleUserId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutResponsible, in: query, schema: { type: boolean, default: false } }
        - { name: payerUserId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: sort, in: query, description: Desempate por descrição e id., schema: { type: string, enum: [PAYMENT_DATE, PAID_AMOUNT, DESCRIPTION], default: PAYMENT_DATE } }
        - { name: direction, in: query, schema: { type: string, enum: [ASC, DESC], default: ASC } }
      responses:
        "200":
          description: Indicadores e página com dinheiro em strings decimais exatas de duas casas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentReport" }
        "400":
          description: Mês, página, ordenação ou combinação de filtros inválida (REPORT_QUERY_INVALID).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Sem associação ativa a um espaço (ACTIVE_SPACE_ACCESS_NOT_FOUND)., content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /reports/planning:
    get:
      operationId: planningReport
      summary: Planejamento do mês atual e dos 12 seguintes, com lançamentos e previsões sem dupla contagem
      description: >-
        Base temporal DUE_DATE. Soma os lançamentos ativos (avulsas, parcelas e ocorrências de recorrência, pendentes
        ou pagos; canceladas fora) e as previsões das recorrências cujo período ainda não tem lançamento (identidade
        recorrência + período; o lançamento prevalece, mesmo remarcado ou cancelado). Totais do horizonte e de cada mês
        somam toda a seleção; a lista traz um mês por vez, por data, lançamentos antes de previsões no mesmo dia.
        Somente leitura: abrir o planejamento não gera lançamentos. Não há receitas, saldo nem orçamento.
      security:
        - sessionCookie: []
      parameters:
        - { name: month, in: query, description: Mês AAAA-MM da lista, dentro do horizonte; ausente usa o mês atual no fuso do espaço., schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutCategory, in: query, schema: { type: boolean, default: false } }
        - { name: responsibleUserId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutResponsible, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Totais do horizonte, de cada mês e do mês escolhido, e uma página desse mês; dinheiro em strings decimais exatas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Planning" }
        "400":
          description: Mês fora do horizonte ou inválido, página, tamanho ou combinação de filtros inválida (REPORT_QUERY_INVALID).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Sem associação ativa a um espaço (ACTIVE_SPACE_ACCESS_NOT_FOUND)., content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /reports/expenses/export:
    get:
      operationId: exportExpensesCsv
      summary: CSV de todos os lançamentos da seleção da lista de despesas, para Excel em português
      description: >-
        Mesma população e ordem de GET /expenses para os mesmos filtros (sem página): sem datas, o mês atual no fuso do
        espaço; cancelados só com status CANCELLED ou ALL, identificados na coluna Situação. Previsões nunca entram
        (arquivo separado em /reports/planning/export) e anexos, observações e ids internos também não. UTF-8 com BOM,
        separador ponto e vírgula, CRLF, datas dd/mm/aaaa, valores com vírgula decimal e sem milhar, textos entre aspas
        (RFC 4180); texto que começa com =, +, -, @, tabulação ou retorno de carro recebe um apóstrofo. Colunas:
        Descrição; Categoria; Vencimento; Valor da cobrança; Estimativa; Situação; Valor pago; Data do pagamento;
        Responsável; Pagador; Origem; Parcela; ID do lançamento. Contagem e linhas vêm de um único retrato (REPEATABLE
        READ); acima de 10.000 linhas a exportação é recusada antes de escrever, nunca truncada.
      security:
        - sessionCookie: []
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - { name: dateBasis, in: query, schema: { type: string, enum: [DUE_DATE, PAYMENT_DATE], default: DUE_DATE } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutCategory, in: query, schema: { type: boolean, default: false } }
        - { name: responsibleUserId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutResponsible, in: query, schema: { type: boolean, default: false } }
        - { name: payerUserId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, PENDING, OVERDUE, PAID, CANCELLED, ALL], default: ACTIVE } }
        - { name: sort, in: query, description: Desempate por instante de criação e id., schema: { type: string, enum: [REFERENCE_DATE, AMOUNT, DESCRIPTION], default: REFERENCE_DATE } }
        - { name: direction, in: query, schema: { type: string, enum: [ASC, DESC], default: ASC } }
      responses:
        "200":
          description: Arquivo completo; seleção vazia devolve só o cabeçalho com X-Export-Rows 0.
          headers:
            Content-Disposition: { description: 'attachment; filename="despesas_vencimento_2026-10-01_a_2026-10-31.csv" (base e período; "desde_"/"ate_" quando o período é aberto)', schema: { type: string } }
            X-Export-Rows: { description: Quantidade de linhas de dados., schema: { type: integer } }
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            text/csv:
              schema: { type: string }
        "400":
          description: Filtros inválidos (REPORT_QUERY_INVALID).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Sem associação ativa a um espaço (ACTIVE_SPACE_ACCESS_NOT_FOUND)., content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422":
          description: Mais de 10.000 linhas (EXPORT_LIMIT_EXCEEDED); a mensagem traz a quantidade e o limite. Nada é gerado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /reports/planning/export:
    get:
      operationId: exportForecastsCsv
      summary: CSV separado das previsões de recorrência ainda não lançadas no horizonte do planejamento
      description: >-
        Mesmo horizonte (mês atual e os 12 seguintes) e filtros de GET /reports/planning; somente previsões, nunca
        lançamentos. Mesmo formato do CSV de despesas. Colunas: Descrição; Categoria; Vencimento previsto; Valor
        previsto; Estimativa; Responsável; Tipo (Previsão de recorrência); ID da recorrência. Limite de 10.000 linhas.
      security:
        - sessionCookie: []
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutCategory, in: query, schema: { type: boolean, default: false } }
        - { name: responsibleUserId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutResponsible, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: 'Arquivo completo, filename="previsoes_2026-10_a_2027-10.csv"; X-Export-Rows com a quantidade.'
          content:
            text/csv:
              schema: { type: string }
        "400":
          description: Filtros inválidos (REPORT_QUERY_INVALID).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Sem associação ativa a um espaço (ACTIVE_SPACE_ACCESS_NOT_FOUND)., content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422":
          description: Mais de 10.000 previsões (EXPORT_LIMIT_EXCEEDED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /reports/closings/{month}:
    parameters:
      - { name: month, in: path, required: true, description: Mês AAAA-MM., schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
    get:
      operationId: monthClosing
      summary: Retrato salvo do mês (versão vigente) e dados atuais recalculados, por vencimento
      description: >-
        E07. saved é o conteúdo gravado no fechamento, lido só das tabelas do fechamento (rótulos e valores do
        instante em que foi salvo), ou null se o mês não foi fechado. current é recalculado agora dos lançamentos
        atuais com as mesmas regras e nunca é gravado. Base temporal DUE_DATE, sem filtros; canceladas, previsões não
        geradas e cabeçalho de compra parcelada não entram; pendências de meses anteriores ficam no fechamento do mês
        de origem. Leitura em transação somente leitura REPEATABLE READ. Os dois papéis consultam.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Fechamento do mês.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthClosing" }
        "400":
          description: Mês inválido (REPORT_QUERY_INVALID).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Sem associação ativa a um espaço (ACTIVE_SPACE_ACCESS_NOT_FOUND)., content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    post:
      operationId: closeMonth
      summary: Fecha o mês salvando a versão 1 do retrato (H07.1)
      description: >-
        Os dois papéis fecham. Só o mês atual (no fuso do espaço) ou anteriores. Os lançamentos do mês são lidos numa
        única instrução; totais, categorias e pendências vêm dessas linhas com as regras do painel H06.1. Cabeçalho,
        versão, categorias, linhas, evento MONTH_CLOSED e chave de repetição são gravados numa transação. Não altera
        nenhuma despesa. Com pendências, exige acknowledgePending = true.
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      parameters:
        - { name: Idempotency-Key, in: header, required: true, description: Mesma chave e mesmo pedido devolvem o fechamento original (200)., schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledgePending: { type: boolean, default: false, description: Confirmação do aviso de pendências (RF-FEC-02). }
            example: { acknowledgePending: true }
      responses:
        "201":
          description: Mês fechado; Location aponta para GET /reports/closings/{month}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthClosing" }
        "200":
          description: Repetição da mesma chave e do mesmo pedido; devolve o fechamento original.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthClosing" }
        "400":
          description: Mês, corpo ou Idempotency-Key inválidos (REPORT_QUERY_INVALID).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Sem associação ativa a um espaço (ACTIVE_SPACE_ACCESS_NOT_FOUND) ou CSRF ausente., content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409":
          description: >-
            MONTH_ALREADY_CLOSED (o mês já tem fechamento; atualizar é gerar nova versão) ou IDEMPOTENCY_CONFLICT
            (chave usada para outro pedido).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: >-
            CLOSING_MONTH_NOT_ALLOWED (mês futuro no fuso do espaço) ou CLOSING_PENDING_CONFIRMATION_REQUIRED (há
            pendências e o aviso não foi confirmado; nada é gravado).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
    xsrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
    xsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
    setupSecret:
      type: apiKey
      in: header
      name: X-Setup-Secret
  responses:
    BadRequest:
      description: Campos ou invariantes inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Sessão ausente/expirada ou credenciais inválidas, conforme o endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Principal autenticado sem associação ativa ou sem o papel exigido no espaço.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    GenericEmailAccepted:
      description: Resposta genérica; não confirma existência nem estado da conta.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericEmailResponse"
  parameters:
    MemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RecurrenceFrequency:
      type: string
      enum: [MONTHLY, BIMONTHLY, QUARTERLY, SEMIANNUAL, ANNUAL]
    CreateRecurrence:
      type: object
      required: [description, amount, valueType, frequency, firstDueDate]
      properties:
        description: { type: string, maxLength: 200 }
        amount: { type: string, pattern: '^\\d{1,8}(\\.\\d{1,2})?$' }
        valueType: { type: string, enum: [FIXED, VARIABLE_ESTIMATE] }
        frequency: { $ref: '#/components/schemas/RecurrenceFrequency' }
        firstDueDate: { type: string, format: date }
        lastDueDate: { type: [string, 'null'], format: date }
        categoryId: { type: [string, 'null'], format: uuid }
        responsibleUserId: { type: [string, 'null'], format: uuid }
    Recurrence:
      allOf:
        - $ref: '#/components/schemas/CreateRecurrence'
        - type: object
          required: [id, baseDay, createdByDisplayName, createdAt, version, previewDates]
          properties:
            id: { type: string, format: uuid }
            baseDay: { type: integer, minimum: 1, maximum: 31 }
            categoryName: { type: [string, 'null'] }
            responsibleDisplayName: { type: [string, 'null'] }
            createdByDisplayName: { type: string }
            createdAt: { type: string, format: date-time }
            version: { type: integer, format: int64 }
            previewDates: { type: array, maxItems: 12, items: { type: string, format: date } }
            upcomingDates:
              type: array
              maxItems: 13
              description: Vencimentos da programação no mês atual e nos 12 seguintes (H04.5).
              items: { type: string, format: date }
            closedAt: { type: [string, 'null'], format: date-time }
            closedByDisplayName: { type: [string, 'null'] }
            closureReason: { type: [string, 'null'], maxLength: 2000 }
            segments:
              type: array
              description: Configuração em vigor por período; a última aplicável ao mês atual preenche os campos de topo.
              items: { $ref: '#/components/schemas/RecurrenceSegment' }
            changes: { type: array, items: { $ref: '#/components/schemas/RecurrenceChange' } }
    RecurrenceSegment:
      type: object
      required: [effectiveMonth, description, amount, frequency, dueDay]
      properties:
        effectiveMonth: { type: string, format: date, description: Primeiro dia do mês a partir do qual vale. }
        description: { type: string }
        amount: { type: string }
        frequency: { $ref: '#/components/schemas/RecurrenceFrequency' }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        categoryId: { type: [string, 'null'], format: uuid }
        categoryName: { type: [string, 'null'] }
        responsibleUserId: { type: [string, 'null'], format: uuid }
        responsibleDisplayName: { type: [string, 'null'] }
    RecurrenceChange:
      type: object
      required: [id, type, actorUserId, actorDisplayName, occurredAt, version, effectiveDueDate, changedFields]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [CHANGE, CLOSURE] }
        actorUserId: { type: string, format: uuid }
        actorDisplayName: { type: string }
        occurredAt: { type: string, format: date-time }
        version: { type: integer, format: int64, description: Versão da definição antes da alteração. }
        effectiveDueDate: { type: string, format: date }
        changedFields: { type: array, items: { type: string } }
        reason: { type: [string, 'null'], maxLength: 2000 }
        updatedCount: { type: integer }
        removedCount: { type: integer }
        reviewCount: { type: integer }
        preservedCount: { type: integer }
    ChangeRecurrenceRequest:
      type: object
      required: [version, effectiveDueDate, description, amount, frequency, dueDay]
      properties:
        version: { type: integer, format: int64 }
        effectiveDueDate: { type: string, format: date }
        description: { type: string, minLength: 1, maxLength: 200 }
        amount: { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$', description: Valor fixo ou nova estimativa base. }
        frequency: { $ref: '#/components/schemas/RecurrenceFrequency' }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        categoryId: { type: [string, 'null'], format: uuid }
        responsibleUserId: { type: [string, 'null'], format: uuid }
        impactToken: { type: string, description: Obrigatório para aplicar; ignorado na prévia. }
    CloseRecurrenceRequest:
      type: object
      required: [version, lastDueDate]
      properties:
        version: { type: integer, format: int64 }
        lastDueDate: { type: string, format: date, description: Data de corte inclusiva. }
        reason: { type: string, minLength: 1, maxLength: 2000, description: Obrigatório para aplicar. }
        impactToken: { type: string, description: Obrigatório para aplicar; ignorado na prévia. }
    RecurrenceImpact:
      type: object
      required: [recurrenceId, operation, version, effectiveDueDate, changedFields, impactToken, occurrences, forecasts,
        updatedCount, removedCount, reviewCount, preservedCount]
      properties:
        recurrenceId: { type: string, format: uuid }
        operation: { type: string, enum: [CHANGE, CLOSURE] }
        version: { type: integer, format: int64 }
        effectiveDueDate: { type: string, format: date, description: Primeiro período alterado ou último período mantido. }
        changedFields: { type: array, items: { type: string } }
        impactToken: { type: string, description: SHA-256 do impacto exibido. }
        occurrences:
          type: array
          items:
            type: object
            required: [expenseId, scheduledDueDate, dueDate, description, amount, status, chargeConfirmed, action, reason,
              changes, preservedFields]
            properties:
              expenseId: { type: string, format: uuid }
              scheduledDueDate: { type: string, format: date }
              dueDate: { type: string, format: date }
              description: { type: string }
              amount: { type: string }
              status: { type: string, enum: [PENDING, PAID, CANCELLED] }
              chargeConfirmed: { type: boolean }
              action: { type: string, enum: [UPDATE, REMOVE, REVIEW, PRESERVE] }
              reason: { type: string, enum: [CHANGED, UNCHANGED, PAID, CANCELLED, AFTER_END, OUTSIDE_SCHEDULE] }
              changes:
                type: array
                items:
                  type: object
                  properties:
                    field: { type: string }
                    previousValue: { type: [string, 'null'] }
                    newValue: { type: [string, 'null'] }
              preservedFields: { type: array, items: { type: string } }
        forecasts:
          type: array
          description: Períodos ainda não materializados no horizonte (mês atual + 12).
          items:
            type: object
            required: [month, action]
            properties:
              month: { type: string, format: date }
              action: { type: string, enum: [CHANGED, ADDED, REMOVED] }
              previousDueDate: { type: [string, 'null'], format: date }
              newDueDate: { type: [string, 'null'], format: date }
              previousAmount: { type: [string, 'null'] }
              newAmount: { type: [string, 'null'] }
              previousDescription: { type: [string, 'null'] }
              newDescription: { type: [string, 'null'] }
        updatedCount: { type: integer }
        removedCount: { type: integer }
        reviewCount: { type: integer }
        preservedCount: { type: integer }
    RecurrenceChangeResult:
      type: object
      required: [recurrence, change, replayed]
      properties:
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        change: { $ref: '#/components/schemas/RecurrenceChange' }
        replayed: { type: boolean }
    RecurrenceForecast:
      type: object
      required: [recurrenceId, description, amount, estimated, scheduledDueDate, state, chargeConfirmed]
      properties:
        recurrenceId: { type: string, format: uuid }
        description: { type: string }
        amount: { type: string }
        estimated: { type: boolean }
        scheduledDueDate: { type: string, format: date }
        state: { type: string, enum: [FORECAST, MATERIALIZED] }
        expenseId: { type: [string, 'null'], format: uuid }
        actualDueDate: { type: [string, 'null'], format: date }
        expenseStatus: { type: [string, 'null'], enum: [PENDING, PAID, CANCELLED, null] }
        chargeConfirmed: { type: boolean }
        reviewReason:
          type: [string, 'null']
          enum: [AFTER_END, OUTSIDE_SCHEDULE, null]
          description: Lançamento pago, confirmado ou com vencimento corrigido que saiu da programação e precisa de revisão individual (H04.5).
    ForecastPeriod:
      type: object
      required: [from, to, occurrences]
      properties:
        from: { type: string, pattern: '^\d{4}-\d{2}$' }
        to: { type: string, pattern: '^\d{4}-\d{2}$' }
        occurrences: { type: array, items: { $ref: '#/components/schemas/RecurrenceForecast' } }
    AnticipationResult:
      type: object
      required: [occurrence, replayed]
      properties:
        occurrence: { $ref: '#/components/schemas/RecurrenceForecast' }
        replayed: { type: boolean }
    ExpenseFilterPerson:
      type: object
      required: [userId, displayName, activeMember]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        activeMember: { type: boolean }
    Category:
      type: object
      required: [id, name, archived, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        archived: { type: boolean }
        version: { type: integer, format: int64, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    CategoryNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    RenameCategoryRequest:
      allOf:
        - $ref: "#/components/schemas/CategoryNameRequest"
        - type: object
          required: [version]
          properties:
            version: { type: integer, format: int64, minimum: 0 }
    CategoryVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
    CreateExpenseRequest:
      type: object
      additionalProperties: false
      required: [description, amount, status]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          type: string
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          example: "150.00"
        status:
          type: string
          enum: [PENDING, PAID]
        dueDate:
          type: [string, "null"]
          format: date
          description: Obrigatório para PENDING; opcional para PAID.
        paymentDate:
          type: [string, "null"]
          format: date
          description: Obrigatório para PAID e ausente para PENDING.
        notes:
          type: [string, "null"]
          maxLength: 2000
        paidAmount:
          type: [string, "null"]
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          description: Para PAID, valor efetivo; omissão sugere o valor da cobrança.
        paidByUserId:
          type: [string, "null"]
          format: uuid
          description: Para PAID, membro ativo pagador; omissão sugere o autor.
        paymentNotes:
          type: [string, "null"]
          maxLength: 2000
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Categoria ativa do espaço; ausência representa Sem categoria.
        responsibleUserId:
          type: [string, "null"]
          format: uuid
          description: Membro ativo do espaço responsável; ausência deixa a responsabilidade não definida.
    PaymentRequest:
      type: object
      additionalProperties: false
      required: [version, paidAmount, paymentDate, paidByUserId]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        paidAmount:
          type: string
          pattern: '^\d{1,8}(\.\d{1,2})?$'
        paymentDate: { type: string, format: date }
        paidByUserId: { type: string, format: uuid }
        paymentNotes: { type: [string, "null"], maxLength: 2000 }
        confirmedChargeAmount:
          type: [string, "null"]
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          description: >-
            Obrigatório somente para cobrança recorrente ainda estimada. Confirma o valor da cobrança e quita na
            mesma transação; o valor pago (com juros ou desconto) nunca vira referência de estimativa.
    ChargeConfirmationRequest:
      type: object
      additionalProperties: false
      required: [version, confirmedAmount]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        confirmedAmount:
          type: string
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          description: Valor real da cobrança, entre 0.01 e 99999999.99.
    ChargeConfirmation:
      type: object
      required: [estimatedAmount, confirmedAt, confirmedByUserId, confirmedByDisplayName]
      properties:
        estimatedAmount:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: Estimativa substituída pela confirmação.
        confirmedAt: { type: string, format: date-time }
        confirmedByUserId: { type: string, format: uuid }
        confirmedByDisplayName: { type: string }
    BatchPaymentRequest:
      type: object
      additionalProperties: false
      required: [items, paymentDate, paidByUserId, confirmed]
      properties:
        items:
          type: array
          minItems: 1
          description: Seleção sem IDs repetidos; a ordem não altera a identidade da intenção.
          items:
            type: object
            additionalProperties: false
            required: [expenseId, version]
            properties:
              expenseId: { type: string, format: uuid }
              version: { type: integer, format: int64, minimum: 0 }
        paymentDate: { type: string, format: date }
        paidByUserId:
          type: string
          format: uuid
          description: Membro ativo do mesmo espaço, comum a todos os itens.
        confirmed:
          const: true
          description: Confirmação explícita da quitação integral de todos ou nenhum.
    BatchPaymentResult:
      type: object
      required: [operationId, items, replayed]
      properties:
        operationId: { type: string, format: uuid }
        replayed: { type: boolean }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [expenseId, fromVersion, toVersion, paidAmount]
            properties:
              expenseId: { type: string, format: uuid }
              fromVersion: { type: integer, format: int64, minimum: 0 }
              toVersion: { type: integer, format: int64, minimum: 1 }
              paidAmount: { type: string, pattern: '^\d+\.\d{2}$' }
    CorrectExpenseRequest:
      type: object
      additionalProperties: false
      required: [version, status, description, amount]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        status:
          type: string
          enum: [PENDING, PAID]
          description: Deve coincidir com a situação carregada; correção não muda o estado.
        description: { type: string, minLength: 1, maxLength: 200 }
        amount:
          type: string
          pattern: '^\d{1,8}(\.\d{1,2})?$'
        dueDate:
          type: [string, "null"]
          format: date
          description: Obrigatório para PENDING e opcional para PAID.
        notes: { type: [string, "null"], maxLength: 2000 }
        paidAmount:
          type: [string, "null"]
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          description: Obrigatório somente para PAID.
        paymentDate:
          type: [string, "null"]
          format: date
          description: Obrigatório somente para PAID.
        paidByUserId:
          type: [string, "null"]
          format: uuid
          description: Membro ativo pagador; obrigatório somente para PAID.
        paymentNotes: { type: [string, "null"], maxLength: 2000 }
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Categoria ativa do espaço, ou a categoria arquivada já vinculada quando não houver troca.
        responsibleUserId:
          type: [string, "null"]
          format: uuid
          description: Membro ativo do espaço, ou nulo para remover a atribuição.
    ExpenseActionRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    InstallmentPurchaseRequest:
      type: object
      required: [description, totalAmount, installmentCount, firstDueDate]
      properties:
        description: { type: string, minLength: 1, maxLength: 200 }
        totalAmount:
          type: string
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          description: Valor final da compra (já com juros, se houver), de 0.01 a 99999999.99 e ao menos 0.01 por parcela.
        installmentCount: { type: integer, minimum: 2, maximum: 360 }
        firstDueDate:
          type: string
          format: date
          description: Vencimento da primeira parcela; o dia é a referência mensal. Datas passadas são aceitas.
        categoryId: { type: [string, "null"], format: uuid }
        responsibleUserId: { type: [string, "null"], format: uuid }
    InstallmentView:
      type: object
      required: [number, count, amount, dueDate]
      properties:
        number: { type: integer, minimum: 1 }
        count: { type: integer, minimum: 2, maximum: 360 }
        amount: { type: string, pattern: '^\d+\.\d{2}$' }
        dueDate: { type: string, format: date }
        expenseId: { type: [string, "null"], format: uuid, description: Nulo na prévia. }
        status: { type: [string, "null"], enum: [PENDING, PAID, CANCELLED, null], description: Nulo na prévia. }
        version: { type: [integer, "null"], format: int64, description: Versão otimista da parcela; nula na prévia. }
        overdue: { type: boolean, description: Pendente com vencimento anterior a hoje no fuso do espaço. }
        description: { type: [string, "null"], description: Descrição atual da parcela; nula na prévia. }
        categoryId: { type: [string, "null"], format: uuid }
        categoryName: { type: [string, "null"] }
        responsibleUserId: { type: [string, "null"], format: uuid }
        responsibleDisplayName: { type: [string, "null"] }
        paymentDate: { type: [string, "null"], format: date }
        paidAmount: { type: [string, "null"], description: Valor efetivamente pago, quando quitada. }
    InstallmentProgress:
      type: object
      description: Derivado só da situação das parcelas; valores são somas das cobranças por situação, não saldo bancário.
      required: [installmentCount, paidCount, pendingCount, overdueCount, cancelledCount, paidAmount, pendingAmount,
        overdueAmount, cancelledAmount]
      properties:
        installmentCount: { type: integer }
        paidCount: { type: integer }
        pendingCount: { type: integer, description: Inclui as atrasadas. }
        overdueCount: { type: integer }
        cancelledCount: { type: integer }
        paidAmount: { type: string }
        pendingAmount: { type: string, description: Quanto falta pagar (atrasadas incluídas). }
        overdueAmount: { type: string }
        cancelledAmount: { type: string }
        nextDueDate: { type: [string, "null"], format: date, description: Menor vencimento pendente. }
    InstallmentPurchaseSummary:
      type: object
      required: [id, description, totalAmount, installmentCount, firstDueDate, createdAt, progress]
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        totalAmount: { type: string }
        installmentCount: { type: integer }
        firstDueDate: { type: string, format: date }
        lastDueDate: { type: [string, "null"], format: date }
        categoryName: { type: [string, "null"] }
        responsibleDisplayName: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        progress: { $ref: '#/components/schemas/InstallmentProgress' }
    InstallmentPurchasePage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InstallmentPurchaseSummary' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
    InstallmentPreview:
      type: object
      required: [description, totalAmount, installmentCount, firstDueDate, lastDueDate, regularAmount, lastAmount,
        lastInstallmentAdjustment, installmentsSum, installments]
      properties:
        description: { type: string }
        totalAmount: { type: string }
        installmentCount: { type: integer }
        firstDueDate: { type: string, format: date }
        lastDueDate: { type: string, format: date }
        regularAmount: { type: string, description: Valor das parcelas 1..N-1. }
        lastAmount: { type: string, description: Valor da parcela N (regular + centavos restantes). }
        lastInstallmentAdjustment: { type: string, description: 'lastAmount - regularAmount; "0.00" em divisão exata.' }
        installmentsSum: { type: string, description: Sempre igual a totalAmount. }
        installments: { type: array, items: { $ref: '#/components/schemas/InstallmentView' } }
    InstallmentChangeRequest:
      type: object
      required: [fromNumber, scope, changedFields]
      properties:
        fromNumber: { type: integer, minimum: 1, description: Parcela pendente de onde a alteração começa. }
        scope: { type: string, enum: [THIS, THIS_AND_FOLLOWING] }
        changedFields:
          type: array
          minItems: 1
          items: { type: string, enum: [description, categoryId, responsibleUserId, dueDate] }
          description: Só os campos listados são aplicados; categoryId/responsibleUserId nulos removem o vínculo.
        description: { type: [string, "null"], maxLength: 200 }
        categoryId: { type: [string, "null"], format: uuid }
        responsibleUserId: { type: [string, "null"], format: uuid }
        dueDate: { type: [string, "null"], format: date, description: Novo vencimento da parcela fromNumber. }
        impactToken: { type: [string, "null"], description: Obrigatório na confirmação; ignorado na prévia. }
    InstallmentCancellationRequest:
      type: object
      required: [installmentNumbers, reason]
      properties:
        installmentNumbers: { type: array, minItems: 1, items: { type: integer, minimum: 1 } }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        replacement:
          oneOf:
            - { $ref: '#/components/schemas/InstallmentPurchaseRequest' }
            - { type: "null" }
          description: Nova compra com o restante (regras da H05.1), criada na mesma transação.
        impactToken: { type: [string, "null"], description: Obrigatório na confirmação; ignorado na prévia. }
    InstallmentImpact:
      type: object
      required: [changeType, impactToken, affected, preserved, affectedAmount]
      properties:
        changeType: { type: string, enum: [CHANGE, CANCELLATION] }
        impactToken: { type: string, description: SHA-256 das parcelas afetadas, versões e novos valores. }
        affected:
          type: array
          items:
            type: object
            required: [number, expenseId, version, amount, dueDate, changes]
            properties:
              number: { type: integer }
              expenseId: { type: string, format: uuid }
              version: { type: integer }
              amount: { type: string }
              dueDate: { type: string, format: date }
              changes:
                type: array
                items:
                  type: object
                  properties:
                    field: { type: string, description: 'description, categoryId, responsibleUserId, dueDate ou status.' }
                    from: { type: [string, "null"] }
                    to: { type: [string, "null"] }
        preserved:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              status: { type: string, enum: [PENDING, PAID, CANCELLED] }
              reason: { type: string, enum: [PAID, CANCELLED, BEFORE_START, OUTSIDE_SCOPE, UNCHANGED, NOT_SELECTED] }
        affectedAmount: { type: string, description: Soma das cobranças afetadas. }
        replacement:
          oneOf:
            - { $ref: '#/components/schemas/InstallmentPreview' }
            - { type: "null" }
    InstallmentChangeResult:
      type: object
      required: [changeId, changeType, affectedCount, preservedCount, purchase, replayed]
      properties:
        changeId: { type: string, format: uuid }
        changeType: { type: string, enum: [CHANGE, CANCELLATION] }
        affectedCount: { type: integer }
        preservedCount: { type: integer }
        purchase: { $ref: '#/components/schemas/InstallmentPurchase' }
        replacement:
          oneOf:
            - { $ref: '#/components/schemas/InstallmentPurchase' }
            - { type: "null" }
        replayed: { type: boolean }
    InstallmentPurchase:
      type: object
      required: [id, description, totalAmount, installmentCount, firstDueDate, lastDueDate, createdByUserId,
        createdByDisplayName, createdAt, installmentsSum, installments]
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        totalAmount: { type: string }
        installmentCount: { type: integer }
        firstDueDate: { type: string, format: date }
        lastDueDate: { type: string, format: date }
        categoryId: { type: [string, "null"], format: uuid }
        categoryName: { type: [string, "null"] }
        responsibleUserId: { type: [string, "null"], format: uuid }
        responsibleDisplayName: { type: [string, "null"] }
        createdByUserId: { type: string, format: uuid }
        createdByDisplayName: { type: string }
        createdAt: { type: string, format: date-time }
        installmentsSum: { type: string }
        replacesPurchaseId:
          type: [string, "null"]
          format: uuid
          description: Compra cujo restante esta substitui (cancelamento com nova compra, H05.3).
        progress: { $ref: '#/components/schemas/InstallmentProgress' }
        installments: { type: array, items: { $ref: '#/components/schemas/InstallmentView' } }
    Expense:
      type: object
      required: [id, origin, chargeConfirmed, description, amount, currency, status, referenceDate, overdue,
        createdByUserId, createdByDisplayName, createdAt, version, history]
      properties:
        id: { type: string, format: uuid }
        origin:
          type: string
          enum: [ONE_OFF, RECURRENCE, INSTALLMENT]
          description: Origem avulsa, ocorrência materializada de uma recorrência ou parcela de compra parcelada (H05.1).
        installment:
          type: [object, "null"]
          description: >-
            Somente para `INSTALLMENT`: compra de origem e posição n/N. O valor da parcela não muda por correção
            individual (`400` com `field: amount`).
          properties:
            purchaseId: { type: string, format: uuid }
            number: { type: integer, minimum: 1 }
            count: { type: integer, minimum: 2, maximum: 360 }
        chargeConfirmed:
          type: boolean
          description: >-
            Falso somente enquanto uma estimativa variável recorrente aguarda confirmação. Nesse estado `amount`
            é a estimativa atual, a quitação exige `confirmedChargeAmount` e o lote a recusa (`AMOUNT_UNCONFIRMED`).
        description: { type: string }
        amount:
          type: string
          pattern: '^\d+\.\d{2}$'
        currency: { const: BRL }
        status: { type: string, enum: [PENDING, PAID, CANCELLED] }
        dueDate: { type: [string, "null"], format: date }
        paymentDate: { type: [string, "null"], format: date }
        paidAmount:
          type: [string, "null"]
          pattern: '^\d+\.\d{2}$'
        referenceDate: { type: string, format: date }
        overdue:
          type: boolean
          description: Somente PENDING com vencimento anterior à data local do espaço.
        categoryId: { type: [string, "null"], format: uuid }
        categoryName:
          type: [string, "null"]
          description: Nome atual preservado para leitura; nulo é apresentado como Sem categoria.
        responsibleUserId: { type: [string, "null"], format: uuid }
        responsibleDisplayName:
          type: [string, "null"]
          description: Nome atual do responsável; nulo representa responsabilidade não definida.
        notes: { type: [string, "null"] }
        createdByUserId: { type: string, format: uuid }
        createdByDisplayName: { type: string }
        paidByUserId: { type: [string, "null"], format: uuid }
        paidByDisplayName: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
        paymentAudit:
          oneOf:
            - $ref: "#/components/schemas/PaymentAudit"
            - type: "null"
        chargeConfirmation:
          description: Auditoria da confirmação de uma estimativa variável; nulo quando a cobrança nunca foi estimada.
          oneOf:
            - $ref: "#/components/schemas/ChargeConfirmation"
            - type: "null"
        history:
          type: array
          description: Eventos históricos no detalhe; a listagem retorna lista vazia.
          items: { $ref: "#/components/schemas/ExpenseHistoryEvent" }
    PaymentAudit:
      type: object
      required: [recordedByUserId, recordedByDisplayName, recordedAt]
      properties:
        recordedByUserId: { type: string, format: uuid }
        recordedByDisplayName: { type: string }
        recordedAt: { type: string, format: date-time }
        notes: { type: [string, "null"], maxLength: 2000 }
    ExpenseHistoryEvent:
      type: object
      required: [type, actorUserId, actorDisplayName, occurredAt, version]
      properties:
        type:
          type: string
          enum: [EXPENSE_CREATED, EXPENSE_PAID, PAYMENT_REVERSED, EXPENSE_CORRECTED, EXPENSE_CANCELLED,
            CHARGE_CONFIRMED, ESTIMATE_UPDATED, RECURRENCE_CHANGE_APPLIED, RECURRENCE_OCCURRENCE_REMOVED,
            INSTALLMENT_CHANGE_APPLIED, INSTALLMENT_CANCELLED]
          description: >-
            CHARGE_CONFIRMED registra estimativa anterior e valor confirmado; ESTIMATE_UPDATED registra a
            atualização automática de uma estimativa posterior causada por uma confirmação. RECURRENCE_CHANGE_APPLIED
            registra os campos alterados por "este e os próximos"; RECURRENCE_OCCURRENCE_REMOVED registra o
            cancelamento de um lançamento estimado que saiu da programação por alteração ou encerramento (H04.5). INSTALLMENT_CHANGE_APPLIED e
            INSTALLMENT_CANCELLED registram alteração e cancelamento feitos pela compra parcelada (H05.3).
        actorUserId: { type: string, format: uuid }
        actorDisplayName: { type: string }
        occurredAt: { type: string, format: date-time }
        reason: { type: [string, "null"], maxLength: 2000 }
        notes: { type: [string, "null"], maxLength: 2000 }
        version: { type: integer, format: int64, minimum: 0 }
        paidAmount: { type: [string, "null"], pattern: '^\d+\.\d{2}$' }
        paymentDate: { type: [string, "null"], format: date }
        payerUserId: { type: [string, "null"], format: uuid }
        payerDisplayName: { type: [string, "null"] }
        changedFields: { type: [string, "null"] }
        batchOperationId:
          type: [string, "null"]
          format: uuid
          description: Correlação comum às auditorias individuais produzidas por uma quitação em lote.
        changes:
          type: array
          description: Valores anterior e posterior disponíveis para cada campo alterado; vazio quando o evento não é uma correção.
          items:
            $ref: "#/components/schemas/ExpenseFieldChange"
    ExpenseFieldChange:
      type: object
      required: [field]
      properties:
        field: { type: string }
        previousValue: { type: [string, "null"] }
        currentValue: { type: [string, "null"] }
    ExpenseHistoryPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/ExpenseHistoryEvent" }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ExpensePage:
      type: object
      required: [content, page, size, totalElements, totalPages, sort, direction]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        sort: { type: string, enum: [REFERENCE_DATE, AMOUNT, DESCRIPTION] }
        direction: { type: string, enum: [ASC, DESC] }
    SpaceMember:
      type: object
      required: [userId, displayName, email, role, currentUser]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMINISTRATOR, GUEST]
        currentUser:
          type: boolean
    InvitationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    InvitationAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          maxLength: 512
        displayName:
          type: [string, "null"]
          minLength: 2
          maxLength: 100
          description: Obrigatório somente para conta nova.
        password:
          type: [string, "null"]
          format: password
          minLength: 12
          maxLength: 72
          description: Obrigatória somente para conta nova; máximo real de 72 bytes UTF-8.
    InvitationState:
      type: object
      required: [pending]
      properties:
        pending:
          type: boolean
        invitedEmail:
          type: [string, "null"]
          format: email
        expiresAt:
          type: [string, "null"]
          format: date-time
    InvitationPreview:
      type: object
      required: [spaceName, existingAccount, loginRequired, authenticatedAsInvitee]
      properties:
        spaceName:
          type: string
        existingAccount:
          type: boolean
        loginRequired:
          type: boolean
        authenticatedAsInvitee:
          type: boolean
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    EmailAccessRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    AccessTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: Token opaco; somente o hash SHA-256 é persistido.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          description: Até 72 bytes UTF-8, contendo ao menos uma letra e um número.
    GenericEmailResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Texto deliberadamente genérico contra enumeração de contas.
    SetupStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [AVAILABLE, SECRET_NOT_CONFIGURED, COMPLETED]
    InitialSetupRequest:
      type: object
      additionalProperties: false
      required: [administratorName, email, password, spaceName]
      properties:
        administratorName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          description: Até 72 bytes UTF-8, contendo ao menos uma letra e um número.
        spaceName:
          type: string
          minLength: 2
          maxLength: 100
    InitialSetupResult:
      type: object
      required: [administratorId, administratorName, email, spaceId, spaceName, currency, locale, timeZone]
      properties:
        administratorId:
          type: string
          format: uuid
        administratorName:
          type: string
        email:
          type: string
          format: email
        spaceId:
          type: string
          format: uuid
        spaceName:
          type: string
        currency:
          const: BRL
        locale:
          const: pt-BR
        timeZone:
          const: America/Sao_Paulo
    AuthenticatedUserContext:
      type: object
      required: [userId, displayName, email, spaceId, spaceName, role, currency, locale, timeZone]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        spaceId:
          type: string
          format: uuid
        spaceName:
          type: string
        role:
          type: string
          enum: [ADMINISTRATOR, GUEST]
        currency:
          const: BRL
        locale:
          const: pt-BR
        timeZone:
          const: America/Sao_Paulo
    DueDashboard:
      type: object
      required: [month, periodStart, periodEnd, dateBasis, today, timeZone, indicators, previousPending]
      properties:
        month: { type: string, example: "2026-10" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dateBasis: { type: string, enum: [DUE_DATE] }
        today: { type: string, format: date, description: Dia local usado para o atraso. }
        timeZone: { type: string, example: America/Sao_Paulo }
        indicators: { $ref: "#/components/schemas/DueIndicators" }
        previousPending: { $ref: "#/components/schemas/PreviousPending" }
    MonthClosing:
      type: object
      required: [month, periodStart, periodEnd, dateBasis, today, timeZone, closable, current]
      properties:
        month: { type: string, example: "2026-10" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dateBasis: { type: string, enum: [DUE_DATE] }
        today: { type: string, format: date, description: Data local do espaço. }
        timeZone: { type: string, example: America/Sao_Paulo }
        closable: { type: boolean, description: Mês atual ou anterior no fuso do espaço. }
        saved: { oneOf: [{ $ref: "#/components/schemas/ClosingSnapshot" }, { type: 'null' }], description: Versão vigente gravada; null se o mês não foi fechado. }
        current: { $ref: "#/components/schemas/ClosingSnapshot" }
    ClosingSnapshot:
      type: object
      description: >-
        Conteúdo de um fechamento. Na versão salva, version, autor e closedAt vêm preenchidos e businessDate é a data
        local usada para o atraso; nos dados atuais esses campos são null e businessDate é hoje. contentDigest (SHA-256)
        identifica valores e classificações (lançamento, referência, situação, cobrança, estimativa, valor pago,
        categoria), nunca rótulos nem atraso.
      properties:
        version: { type: [integer, 'null'] }
        authorUserId: { type: [string, 'null'], format: uuid }
        authorDisplayName: { type: [string, 'null'], description: Nome do autor no momento do fechamento. }
        closedAt: { type: [string, 'null'], format: date-time }
        businessDate: { type: string, format: date }
        timeZone: { type: string }
        pendingAcknowledged: { type: boolean }
        contentDigest: { type: string, minLength: 64, maxLength: 64 }
        indicators: { $ref: "#/components/schemas/DueIndicators" }
        categories: { type: array, items: { $ref: "#/components/schemas/ClosingCategory" } }
        lines: { type: array, items: { $ref: "#/components/schemas/ClosingLine" } }
    ClosingCategory:
      type: object
      description: Categoria com o nome do momento; categoryId e categoryName null significam Sem categoria (sempre por último).
      properties:
        categoryId: { type: [string, 'null'], format: uuid }
        categoryName: { type: [string, 'null'] }
        count: { type: integer, format: int64 }
        plannedTotal: { type: string }
        plannedEstimated: { type: string }
        paidTotal: { type: string }
        pendingCount: { type: integer, format: int64 }
        pendingTotal: { type: string }
    ClosingLine:
      type: object
      properties:
        expenseId: { type: string, format: uuid }
        description: { type: string }
        origin: { type: string, enum: [ONE_OFF, RECURRENCE, INSTALLMENT] }
        installmentNumber: { type: [integer, 'null'] }
        installmentCount: { type: [integer, 'null'] }
        referenceDate: { type: string, format: date }
        dueDateInformed: { type: boolean, description: false para paga sem vencimento (referência = data do pagamento). }
        status: { type: string, enum: [PENDING, PAID] }
        chargeAmount: { type: string }
        estimated: { type: boolean }
        paidAmount: { type: [string, 'null'] }
        adjustment: { type: [string, 'null'], description: Pago menos cobrança, só para pagas. }
        overdue: { type: boolean, description: Atraso na businessDate do conteúdo. }
        categoryId: { type: [string, 'null'], format: uuid }
        categoryName: { type: [string, 'null'] }
    DueIndicators:
      type: object
      description: >-
        Previsto = cobranças de pendentes e pagas (estimativas incluídas e destacadas); Pago = valores efetivamente
        pagos das quitações ativas; Pendente = cobranças em aberto (nunca previsto − pago); Atrasado = subconjunto do
        pendente com vencimento anterior a today; Ajustes = acréscimos e descontos (pago − cobrança) das pagas.
      properties:
        plannedCount: { type: integer, format: int64 }
        plannedTotal: { type: string, example: "2792.33" }
        plannedEstimated: { type: string, example: "180.00" }
        paidCount: { type: integer, format: int64 }
        paidTotal: { type: string }
        pendingCount: { type: integer, format: int64 }
        pendingTotal: { type: string }
        pendingEstimated: { type: string }
        overdueCount: { type: integer, format: int64 }
        overdueTotal: { type: string }
        overdueEstimated: { type: string }
        adjustmentIncrease: { type: string }
        adjustmentDiscount: { type: string }
        adjustmentNet: { type: string, description: Acréscimos − descontos; pode ser negativo. }
    PreviousPending:
      type: object
      description: Pendentes com vencimento anterior ao mês, com os mesmos filtros.
      properties:
        dueBefore: { type: string, format: date }
        count: { type: integer, format: int64 }
        total: { type: string }
        estimated: { type: string }
        overdueCount: { type: integer, format: int64 }
        overdueTotal: { type: string }
    Planning:
      type: object
      required: [horizonStart, horizonEnd, periodStart, periodEnd, dateBasis, today, timeZone, totals, months, month, monthTotals, content, page, size, totalElements, totalPages]
      properties:
        horizonStart: { type: string, example: "2026-10" }
        horizonEnd: { type: string, example: "2027-10" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dateBasis: { type: string, enum: [DUE_DATE] }
        today: { type: string, format: date, description: Dia local no fuso do espaço. }
        timeZone: { type: string, example: America/Sao_Paulo }
        totals: { $ref: "#/components/schemas/PlanningTotals" }
        months:
          type: array
          description: Os 13 meses do horizonte, em ordem.
          items:
            type: object
            properties:
              month: { type: string, example: "2026-11" }
              totals: { $ref: "#/components/schemas/PlanningTotals" }
        month: { type: string, example: "2026-10" }
        monthTotals: { $ref: "#/components/schemas/PlanningTotals" }
        content: { type: array, items: { $ref: "#/components/schemas/PlanningItem" } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    PlanningTotals:
      type: object
      description: >-
        planned = confirmed + estimated = materialized + forecast = oneOff + installment + recurrence. paid é o valor
        efetivamente pago das quitações ativas; open soma pendentes e previsões.
      properties:
        count: { type: integer, format: int64 }
        plannedTotal: { type: string, example: "6900.00" }
        confirmedTotal: { type: string }
        estimatedTotal: { type: string }
        materializedCount: { type: integer, format: int64 }
        materializedTotal: { type: string }
        forecastCount: { type: integer, format: int64 }
        forecastTotal: { type: string }
        paidCount: { type: integer, format: int64 }
        paidTotal: { type: string }
        openCount: { type: integer, format: int64 }
        openTotal: { type: string }
        oneOffTotal: { type: string }
        installmentTotal: { type: string }
        recurrenceTotal: { type: string }
    PlanningItem:
      type: object
      properties:
        kind: { type: string, enum: [EXPENSE, FORECAST] }
        expenseId: { type: [string, "null"], format: uuid }
        recurrenceId: { type: [string, "null"], format: uuid, description: Somente em previsões. }
        origin: { type: string, enum: [ONE_OFF, RECURRENCE, INSTALLMENT] }
        installment:
          type: [object, "null"]
          properties:
            purchaseId: { type: string, format: uuid }
            number: { type: integer }
            count: { type: integer }
        description: { type: string }
        date: { type: string, format: date, description: Data de referência do lançamento ou vencimento previsto. }
        dueDate: { type: [string, "null"], format: date }
        amount: { type: string, description: Valor da cobrança (ou previsto). }
        estimated: { type: boolean, description: Valor a confirmar. }
        status: { type: string, enum: [PENDING, PAID, FORECAST] }
        overdue: { type: boolean }
        paidAmount: { type: [string, "null"] }
        paymentDate: { type: [string, "null"], format: date }
        categoryName: { type: [string, "null"] }
        responsibleDisplayName: { type: [string, "null"] }
    PaymentReport:
      type: object
      required: [month, periodStart, periodEnd, dateBasis, timeZone, indicators, content, page, size, totalElements, totalPages, sort, direction]
      properties:
        month: { type: string, example: "2026-10" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dateBasis: { type: string, enum: [PAYMENT_DATE] }
        timeZone: { type: string, example: America/Sao_Paulo }
        indicators: { $ref: "#/components/schemas/PaymentIndicators" }
        content: { type: array, items: { $ref: "#/components/schemas/PaymentRow" } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        sort: { type: string, enum: [PAYMENT_DATE, PAID_AMOUNT, DESCRIPTION] }
        direction: { type: string, enum: [ASC, DESC] }
    PaymentIndicators:
      type: object
      description: Quitações ativas do mês pela data do pagamento; ajustes = pago − cobrança de cada quitação.
      properties:
        count: { type: integer, format: int64 }
        paidTotal: { type: string, example: "1177.33" }
        chargeTotal: { type: string, example: "1162.33" }
        adjustmentIncrease: { type: string, example: "25.00" }
        adjustmentDiscount: { type: string, example: "10.00" }
        adjustmentNet: { type: string, example: "15.00" }
    PaymentRow:
      type: object
      properties:
        expenseId: { type: string, format: uuid }
        description: { type: string }
        origin: { type: string, enum: [ONE_OFF, RECURRENCE, INSTALLMENT] }
        installment:
          type: [object, "null"]
          properties:
            purchaseId: { type: string, format: uuid }
            number: { type: integer }
            count: { type: integer }
        dueDate: { type: [string, "null"], format: date }
        chargeAmount: { type: string }
        chargeConfirmed: { type: boolean }
        paidAmount: { type: string }
        adjustment: { type: string, description: Pago − cobrança; negativo para desconto. }
        paymentDate: { type: string, format: date }
        payerUserId: { type: string, format: uuid }
        payerDisplayName: { type: string, description: Quem pagou (pode ser corrigido). }
        recordedByUserId: { type: string, format: uuid }
        recordedByDisplayName: { type: string, description: Quem registrou a quitação ativa. }
        recordedAt: { type: string, format: date-time }
        batchPayment: { type: boolean, description: Quitação ativa registrada em lote. }
        categoryName: { type: [string, "null"] }
        responsibleDisplayName: { type: [string, "null"] }
        correctionCount: { type: integer, description: Correções de cobrança, valor pago, data ou pagador desde a quitação ativa. }
        lastCorrection:
          type: [object, "null"]
          properties:
            actorUserId: { type: string, format: uuid }
            actorDisplayName: { type: string }
            correctedAt: { type: string, format: date-time }
            changedFields: { type: array, items: { type: string, enum: [amount, paidAmount, paymentDate, paidByUserId] } }
    ApiError:
      type: object
      required: [code, message, fieldErrors, operationId]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        operationId:
          type: string
          format: uuid
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
