openapi: 3.1.0
info:
  title: account_Manager API
  version: 0.1.0
  description: Contrato versionado dos endpoints implementados até H01.2.
servers:
  - url: /api/v1
paths:
  /auth/csrf:
    get:
      operationId: issueCsrfToken
      summary: Emite o cookie CSRF para uma operação mutável subsequente
      responses:
        "200":
          description: Cookie XSRF-TOKEN emitido e nome do header retornado.
          content:
            application/json:
              schema:
                type: object
                required: [headerName]
                properties:
                  headerName:
                    const: X-XSRF-TOKEN
  /auth/login:
    post:
      operationId: login
      summary: Autentica uma conta confirmada e cria uma sessão JDBC
      security:
        - xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Sessão criada; o cookie SESSION é HttpOnly e SameSite=Lax.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      summary: Encerra a sessão atual
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      responses:
        "204":
          description: Sessão atual invalidada.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/sessions:
    delete:
      operationId: revokeAllSessions
      summary: Revoga todas as sessões JDBC da conta autenticada
      security:
        - sessionCookie: []
          xsrfCookie: []
          xsrfHeader: []
      responses:
        "204":
          description: Todas as sessões da conta foram revogadas.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/email-confirmations:
    post:
      operationId: requestEmailConfirmation
      summary: Solicita confirmação de email sem revelar se a conta existe
      security:
        - xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAccessRequest"
      responses:
        "202":
          $ref: "#/components/responses/GenericEmailAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/email-confirmations/confirm:
    post:
      operationId: confirmEmail
      summary: Confirma o email com token de uso único válido por 24 horas
      security:
        - xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessTokenRequest"
      responses:
        "204":
          description: Email confirmado e token consumido.
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/password-resets:
    post:
      operationId: requestPasswordReset
      summary: Solicita recuperação sem revelar se a conta existe
      security:
        - xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAccessRequest"
      responses:
        "202":
          $ref: "#/components/responses/GenericEmailAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/password-resets/complete:
    post:
      operationId: completePasswordReset
      summary: Redefine a senha com token de uso único válido por 30 minutos
      description: O sucesso consome o token e revoga todas as sessões JDBC da conta.
      security:
        - xsrfCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Senha redefinida, token consumido e sessões revogadas.
        "400":
          $ref: "#/components/responses/BadRequest"
  /setup/status:
    get:
      operationId: getInitialSetupStatus
      summary: Consulta se a configuração inicial está disponível
      responses:
        "200":
          description: Estado consultado; também emite o cookie XSRF-TOKEN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /setup:
    post:
      operationId: configureInitialAdministratorAndSpace
      summary: Cria o primeiro administrador e seu espaço uma única vez
      description: >-
        Requer que X-XSRF-TOKEN corresponda ao cookie XSRF-TOKEN e que
        X-Setup-Secret contenha o segredo temporário configurado no servidor.
      security:
        - xsrfCookie: []
          xsrfHeader: []
          setupSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitialSetupRequest"
      responses:
        "201":
          description: Administrador, espaço e associação criados atomicamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialSetupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: >-
            CSRF ausente/inválido (o filtro pode responder sem corpo) ou segredo
            temporário incorreto (ApiError com code SETUP_SECRET_INVALID).
        "409":
          description: A configuração inicial já foi concluída.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: O segredo temporário não está configurado no servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /identity/me:
    get:
      operationId: getAuthenticatedUserContext
      summary: Retorna identidade, papel e espaço do principal autenticado
      security:
        - sessionCookie: []
      parameters:
        - name: X-User-Activity
          in: header
          required: false
          schema:
            type: boolean
          description: >-
            Em GET, true registra atividade humana e renova somente a janela de
            inatividade. A duração absoluta de 30 dias nunca é renovada.
      responses:
        "200":
          description: Associação ativa do usuário autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Sessão válida, porém sem associação ativa (ApiError com code
            ACTIVE_SPACE_ACCESS_NOT_FOUND).
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
    xsrfCookie:
      type: apiKey
      in: cookie
      name: XSRF-TOKEN
    xsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
    setupSecret:
      type: apiKey
      in: header
      name: X-Setup-Secret
  responses:
    BadRequest:
      description: Campos ou invariantes inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Sessão ausente/expirada ou credenciais inválidas, conforme o endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    GenericEmailAccepted:
      description: Resposta genérica; não confirma existência nem estado da conta.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericEmailResponse"
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    EmailAccessRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    AccessTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: Token opaco; somente o hash SHA-256 é persistido.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          description: Até 72 bytes UTF-8, contendo ao menos uma letra e um número.
    GenericEmailResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Texto deliberadamente genérico contra enumeração de contas.
    SetupStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [AVAILABLE, SECRET_NOT_CONFIGURED, COMPLETED]
    InitialSetupRequest:
      type: object
      additionalProperties: false
      required: [administratorName, email, password, spaceName]
      properties:
        administratorName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          description: Até 72 bytes UTF-8, contendo ao menos uma letra e um número.
        spaceName:
          type: string
          minLength: 2
          maxLength: 100
    InitialSetupResult:
      type: object
      required: [administratorId, administratorName, email, spaceId, spaceName, currency, locale, timeZone]
      properties:
        administratorId:
          type: string
          format: uuid
        administratorName:
          type: string
        email:
          type: string
          format: email
        spaceId:
          type: string
          format: uuid
        spaceName:
          type: string
        currency:
          const: BRL
        locale:
          const: pt-BR
        timeZone:
          const: America/Sao_Paulo
    AuthenticatedUserContext:
      type: object
      required: [userId, displayName, email, spaceId, spaceName, role, currency, locale, timeZone]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        spaceId:
          type: string
          format: uuid
        spaceName:
          type: string
        role:
          type: string
          enum: [ADMINISTRATOR, GUEST]
        currency:
          const: BRL
        locale:
          const: pt-BR
        timeZone:
          const: America/Sao_Paulo
    ApiError:
      type: object
      required: [code, message, fieldErrors, operationId]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        operationId:
          type: string
          format: uuid
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
