name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify including PostgreSQL Testcontainers and JaCoCo
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify
      - name: Mutation gate
        working-directory: backend
        run: ./mvnw --batch-mode -Pmutation verify -DskipITs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-quality-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
            backend/target/pit-reports
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production and development dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Component tests and production build
        working-directory: frontend
        run: |
          npm run test:ci
          npm run build
      - name: Install Chromium for smoke test
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        working-directory: frontend
        run: npm run e2e:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn

