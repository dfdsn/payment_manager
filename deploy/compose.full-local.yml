name: account-manager-full-local

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: account_manager
      POSTGRES_USER: account_manager
      POSTGRES_PASSWORD: local-only-change-me
    volumes:
      - db-full-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_manager -d account_manager"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:8025:8025"

  migrate:
    build:
      context: ../backend
    environment: &backend-environment
      APP_MODE: migrate
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/account_manager
      SPRING_DATASOURCE_USERNAME: account_manager
      SPRING_DATASOURCE_PASSWORD: local-only-change-me
      # Segredo conhecido somente para desenvolvimento local. Nunca reutilize fora daqui.
      APP_SETUP_SECRET: local-only-setup-secret-change-me
      APP_BASE_URL: http://localhost:8080
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: account-manager@localhost
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../backend
    environment:
      <<: *backend-environment
      APP_MODE: runtime
      SPRING_FLYWAY_ENABLED: "false"
    volumes:
      - files-full-local:/var/lib/account-manager/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/v1/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ../frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  db-full-local-data:
  files-full-local:
