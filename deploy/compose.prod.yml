name: account-manager

services:
  db:
    image: ${POSTGRES_IMAGE:?Defina POSTGRES_IMAGE com tag/digest aprovado}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - setup_secret
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: ${BACKEND_IMAGE:?Defina BACKEND_IMAGE com tag imutável}
    environment: &backend-environment
      APP_MODE: migrate
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/postgres_password
      APP_ENVIRONMENT: production
      APP_INTEGRATIONS_MODE: real
      APP_SETUP_SECRET_FILE: /run/secrets/setup_secret
      APP_BASE_URL: ${APP_BASE_URL:?Defina APP_BASE_URL com HTTPS}
      APP_FILES_ROOT: /var/lib/account-manager/files
      SMTP_HOST: ${SMTP_HOST:?Defina SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Defina SMTP_USERNAME}
      SMTP_FROM: ${SMTP_FROM:?Defina SMTP_FROM}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      SMTP_STARTTLS_REQUIRED: "true"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
    secrets:
      - postgres_password
      - setup_secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - private-files:/var/lib/account-manager/files
    restart: "no"
    profiles: ["migration"]

  backend:
    image: ${BACKEND_IMAGE:?Defina BACKEND_IMAGE com tag imutável}
    environment:
      <<: *backend-environment
      APP_MODE: runtime
      SPRING_FLYWAY_ENABLED: "false"
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      # H08.4: WhatsApp stays off until P03 is complete and Diego enables it.
      META_WHATSAPP_ENABLED: ${META_WHATSAPP_ENABLED:-false}
      META_WHATSAPP_API_VERSION: ${META_WHATSAPP_API_VERSION:-}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID:-}
      META_WHATSAPP_SUMMARY_TEMPLATE: ${META_WHATSAPP_SUMMARY_TEMPLATE:-}
      META_WHATSAPP_TEMPLATE_LANGUAGE: ${META_WHATSAPP_TEMPLATE_LANGUAGE:-pt_BR}
      META_WHATSAPP_TEST_TEMPLATE: ${META_WHATSAPP_TEST_TEMPLATE:-}
      META_WHATSAPP_TEST_TEMPLATE_LANGUAGE: ${META_WHATSAPP_TEST_TEMPLATE_LANGUAGE:-pt_BR}
      META_WHATSAPP_TOKEN_FILE: /run/secrets/meta_whatsapp_token
      META_WHATSAPP_APP_SECRET_FILE: /run/secrets/meta_whatsapp_app_secret
      META_WHATSAPP_VERIFY_TOKEN_FILE: /run/secrets/meta_whatsapp_verify_token
    secrets:
      - postgres_password
      - setup_secret
      - smtp_password
      - meta_whatsapp_token
      - meta_whatsapp_app_secret
      - meta_whatsapp_verify_token
    volumes:
      - private-files:/var/lib/account-manager/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/v1/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?Defina FRONTEND_IMAGE com tag imutável}
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  private-files:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  setup_secret:
    file: ./secrets/setup_secret.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  # H08.4: may stay empty while META_WHATSAPP_ENABLED=false.
  meta_whatsapp_token:
    file: ./secrets/meta_whatsapp_token.txt
  meta_whatsapp_app_secret:
    file: ./secrets/meta_whatsapp_app_secret.txt
  meta_whatsapp_verify_token:
    file: ./secrets/meta_whatsapp_verify_token.txt
