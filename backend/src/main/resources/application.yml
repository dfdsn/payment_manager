spring:
  application:
    name: account-manager
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  public-base-url: ${APP_BASE_URL:http://localhost:4200}
  files:
    root: ${APP_FILES_ROOT:/var/lib/account-manager/files}
  mail:
    from: ${SMTP_FROM:account-manager@localhost}
  # H08.4: Meta WhatsApp Cloud API. Off by default; secrets come from the environment (filled from *_FILE secrets
  # by the container entrypoint), never from this file.
  whatsapp:
    enabled: ${META_WHATSAPP_ENABLED:false}
    api-base-url: ${META_WHATSAPP_API_BASE_URL:https://graph.facebook.com}
    api-version: ${META_WHATSAPP_API_VERSION:}
    phone-number-id: ${META_WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${META_WHATSAPP_TOKEN:}
    app-secret: ${META_WHATSAPP_APP_SECRET:}
    verify-token: ${META_WHATSAPP_VERIFY_TOKEN:}
    summary-template: ${META_WHATSAPP_SUMMARY_TEMPLATE:}
    template-language: ${META_WHATSAPP_TEMPLATE_LANGUAGE:pt_BR}
    test-template: ${META_WHATSAPP_TEST_TEMPLATE:}
    test-template-language: ${META_WHATSAPP_TEST_TEMPLATE_LANGUAGE:pt_BR}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  max-http-request-header-size: 16KB
  servlet:
    context-path: /api/v1
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
  tomcat:
    max-swallow-size: 11MB
  shutdown: graceful
