spring:
  application:
    name: account-manager
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:false}

app:
  public-base-url: ${APP_BASE_URL:http://localhost:4200}
  mail:
    from: ${SMTP_FROM:account-manager@localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  servlet:
    context-path: /api/v1
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
  shutdown: graceful
